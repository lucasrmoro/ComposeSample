name: Build checked release candidate
description: Run release gates and stage an unsigned APK and public metadata
inputs:
  flavor:
    description: Android product flavor
    required: true
  version:
    description: Reviewed version name
    required: true
  code:
    description: Reviewed Android version code
    required: true
  revision:
    description: Exact commit approved by the release version job
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/android-setup
    - name: Build and inspect candidate
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
        VERSION: ${{ inputs.version }}
        VERSION_CODE: ${{ inputs.code }}
        APPROVED_REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_REF" != refs/heads/main || "$GITHUB_REF_PROTECTED" != true ||
              ( "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch ) ||
              ! "$APPROVED_REVISION" =~ ^[0-9a-f]{40}$ || "$(git rev-parse HEAD)" != "$APPROVED_REVISION" ]]; then
            echo "Release APKs require the reviewed revision already merged into protected main."
            exit 1
        fi
        case "$FLAVOR" in
            dev) variant=DevRelease ;;
            prd) variant=PrdRelease ;;
            *) exit 2 ;;
        esac

        ./gradlew ":app:assemble$variant" ":app:lint$variant" ":app:test${variant}UnitTest" \
            :app:writeReleaseInventory "-PreleaseFlavor=$FLAVOR" \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            "-PappReleaseVersion=$VERSION" "-PappReleaseCode=$VERSION_CODE"
        if [[ "$FLAVOR" == prd ]]; then
            ./gradlew architectureCheck
        fi
        mapping="app/build/outputs/mapping/${FLAVOR}Release/mapping.txt"
        test -s "$mapping"
        # R8's mapping must include at least one renamed application class.
        awk '/^br\.com\.composesample\.[^ ]+ -> / { target=$3; sub(/:$/, "", target); if ($1 != target) found=1 } END { exit !found }' "$mapping"
        mkdir -p candidate
        cp "app/build/outputs/apk/$FLAVOR/release/app-$FLAVOR-release-unsigned.apk" candidate/unsigned.apk
        package=br.com.composesample
        if [[ "$FLAVOR" == dev ]]; then package+=.dev; fi
        apk=candidate/unsigned.apk
        [[ "$(apkanalyzer manifest application-id "$apk")" == "$package" ]]
        [[ "$(apkanalyzer manifest version-name "$apk")" == "$VERSION" ]]
        [[ "$(apkanalyzer manifest version-code "$apk")" == "$VERSION_CODE" ]]
        [[ "$(apkanalyzer manifest debuggable "$apk")" == false ]]
        if ! command -v xmlstarlet >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xmlstarlet
        fi
        manifest="$RUNNER_TEMP/${FLAVOR}-manifest.xml"
        apkanalyzer manifest print "$apk" > "$manifest"
        xml() { xmlstarlet sel -N a=http://schemas.android.com/apk/res/android -t "$@" "$manifest"; }
        [[ "$(xml -v '/manifest/application/@a:usesCleartextTraffic')" == false ]]
        [[ "$(xml -v 'count(/manifest/application[@a:testOnly="true" or @a:networkSecurityConfig] | /manifest/instrumentation)')" == 0 ]]
        launcher='count(/manifest/application/*[self::activity or self::activity-alias][@a:exported="true"]/intent-filter[action/@a:name="android.intent.action.MAIN" and category/@a:name="android.intent.category.LAUNCHER"])'
        [[ "$(xml -v "$launcher")" == 1 ]]
        test_components='count(/manifest/application/*[starts-with(@a:name, "androidx.test.") or starts-with(@a:targetActivity, "androidx.test.")])'
        [[ "$(xml -v "$test_components")" == 0 ]]

        scan="$(mktemp -d)"
        trap 'rm -rf -- "$scan"' EXIT
        curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan/gitleaks.tar.gz" | sha256sum --check --status
        tar -xzf "$scan/gitleaks.tar.gz" -C "$scan" gitleaks
        "$scan/gitleaks" git --redact=100 --log-opts="HEAD^1..HEAD"
        "$scan/gitleaks" dir --redact=100 --max-decode-depth=2 --max-archive-depth=1 candidate
        printf '# Version %s\n\n- %s\n' "$VERSION" "$(git show -s --format=%s HEAD)" > candidate/RELEASE_NOTES.md
        jq -n --arg sha "$(git rev-parse HEAD)" --arg version "$VERSION" --argjson code "$VERSION_CODE" \
            --arg flavor "$FLAVOR" '{sourceCommit:$sha,versionName:$version,versionCode:$code,flavor:$flavor}' > candidate/release.json

    - name: Audit dependencies and write CycloneDX inventory
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        FLAVOR: ${{ inputs.flavor }}
      with:
        script: |
          const fs = require('node:fs');
          const dependencies = JSON.parse(fs.readFileSync(`app/build/reports/release/${process.env.FLAVOR}-dependencies.json`, 'utf8'));
          if (!dependencies.length) throw new Error('Empty release dependency inventory.');
          const queries = dependencies.map(({ group, name, version }) => ({
            package: { ecosystem: 'Maven', name: `${group}:${name}` }, version
          }));
          const findings = [];
          for (let start = 0; start < queries.length; start += 100) {
            const batch = queries.slice(start, start + 100);
            const response = await fetch('https://api.osv.dev/v1/querybatch', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ queries: batch }),
              signal: AbortSignal.timeout(60000)
            });
            if (!response.ok) throw new Error(`OSV request failed (${response.status}).`);
            const { results } = await response.json();
            if (results.length !== batch.length) throw new Error('Incomplete OSV response.');
            results.forEach((result, index) => {
              const query = batch[index];
              for (const advisory of result.vulns ?? []) {
                findings.push(`${query.package.name}:${query.version} ${advisory.id}`);
              }
            });
          }
          if (findings.length) throw new Error(`Review release dependency advisories:\n${findings.join('\n')}`);
          const components = dependencies.map(({ group, name, version }) => ({
            type: 'library', group, name, version,
            purl: `pkg:maven/${encodeURIComponent(group)}/${encodeURIComponent(name)}@${encodeURIComponent(version)}`
          }));
          const sbom = { bomFormat: 'CycloneDX', specVersion: '1.6', version: 1, components };
          fs.writeFileSync('candidate/sbom.cdx.json', JSON.stringify(sbom, null, 2) + '\n');
