name: Smoke test release APK
description: Install and launch the signed release APK on an Android emulator
inputs:
  apk-name:
    description: Signed APK file name
    required: true
  package-name:
    description: Android application ID for this flavor
    required: true
runs:
  using: composite
  steps:
    - name: Run release APK on Android emulator
      uses: reactivecircus/android-emulator-runner@v2
      env:
        APK_NAME: ${{ inputs.apk-name }}
        APK_PACKAGE: ${{ inputs.package-name }}
        SMOKE_TEST_SCRIPT: ${{ github.action_path }}/smoke-test.sh
      with:
        api-level: 36
        arch: x86_64
        target: google_apis
        script: bash "$SMOKE_TEST_SCRIPT"
