name: Architecture validation
description: Run the architecture gate
runs:
  using: composite
  steps:
    - name: Set up Android build
      uses: ./.github/actions/android-setup
    - name: Validate architecture fixtures
      shell: bash
      run: ./gradlew :architecture-tests:architectureFixturesTest
    - name: Validate project architecture
      shell: bash
      run: ./gradlew architectureCheck -x :architecture-tests:architectureFixturesTest
