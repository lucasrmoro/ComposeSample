name: Android Lint
description: Run Android Lint for the dev debug variant
runs:
  using: composite
  steps:
    - name: Set up Android build
      uses: ./.github/actions/android-setup
    - name: Run Android Lint
      shell: bash
      run: ./gradlew :app:lintDevDebug
    - name: Annotate Android Lint errors
      if: ${{ always() }}
      shell: bash
      run: python3 .github/actions/quality-report/emit-lint-annotations.py
