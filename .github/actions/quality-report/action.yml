name: Quality gate report
description: Summarize pull request gate results with correction examples
inputs:
  results-json:
    description: JSON representation of the dependent job results
    required: true
runs:
  using: composite
  steps:
    - name: Write Markdown report and job summary
      shell: bash
      env:
        GATE_RESULTS_JSON: ${{ inputs.results-json }}
      run: python3 "$GITHUB_ACTION_PATH/report.py"
    - name: Publish report in pull request
      if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/github-script@v8
      env:
        GATE_RESULTS_JSON: ${{ inputs.results-json }}
      with:
        # Keep GitHub API pagination and comment management in the adjacent helper for easier review.
        script: |
          const publishReport = require(`${process.env.GITHUB_ACTION_PATH}/publish-report.js`);
          await publishReport({ github, context });
