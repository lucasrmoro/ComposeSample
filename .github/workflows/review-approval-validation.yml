name: Review approval validation

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

concurrency:
  group: review-approval-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-approvals:
    name: Verify CodeRabbit approval
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require CodeRabbit approval of the current commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          reviews="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --paginate --slurp)"
          if ! jq -e --arg head "$HEAD_SHA" '
            [ .[][] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED") ]
            | sort_by(.submitted_at, .id)
            | group_by(.user.login)
            | map(.[-1])
            | any(.[]; .user.login == "coderabbitai[bot]" and .state == "APPROVED" and .commit_id == $head)
          ' <<< "$reviews" > /dev/null; then
            echo "::error::The current commit requires CodeRabbit approval."
            exit 1
          fi
