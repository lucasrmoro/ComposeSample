name: Pull request validation

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-validation:
    name: Validate branch name
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate branch name
        uses: ./.github/actions/branch-validation

  pull-request-title-validation:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate title
        uses: ./.github/actions/pull-request-title-validation

  build:
    name: Build
    needs: [branch-validation, pull-request-title-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        uses: ./.github/actions/build

  lint:
    name: Lint
    needs: [branch-validation, pull-request-title-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Android Lint
        uses: ./.github/actions/android-lint

  unit-tests:
    name: Unit tests
    needs: [branch-validation, pull-request-title-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run app unit tests
        uses: ./.github/actions/unit-tests

  architecture-validation:
    name: Architecture validation
    needs: [branch-validation, pull-request-title-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run architecture checks
        uses: ./.github/actions/architecture-validation

  quality-report:
    name: Quality gate report
    needs:
      - branch-validation
      - pull-request-title-validation
      - build
      - lint
      - unit-tests
      - architecture-validation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Generate quality gate report
        uses: ./.github/actions/quality-report
        with:
          results-json: ${{ toJSON(needs) }}
