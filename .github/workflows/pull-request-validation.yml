name: Pull request validation

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

concurrency:
  # Ignored edits must not cancel validation already running for the PR.
  group: >-
    pull-request-validation-${{ github.event.pull_request.number }}-${{
      github.actor != 'coderabbitai[bot]' && github.triggering_actor != 'coderabbitai[bot]' &&
      (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) &&
      'normal' || 'ignored' }}
  cancel-in-progress: true

jobs:
  branch-validation:
    name: Validate branch name
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.actor != 'coderabbitai[bot]' && github.triggering_actor != 'coderabbitai[bot]' &&
          (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate branch name
        uses: ./.github/actions/branch-validation

  pull-request-title-validation:
    name: Validate PR title
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.actor != 'coderabbitai[bot]' && github.triggering_actor != 'coderabbitai[bot]' &&
          (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate title
        uses: ./.github/actions/pull-request-title-validation

  release-version:
    name: Validate release version
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.actor != 'coderabbitai[bot]' && github.triggering_actor != 'coderabbitai[bot]' &&
          (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) &&
          github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release version
        uses: ./.github/actions/resolve-release-details
        with:
          revision: HEAD
          preview-title: ${{ github.event.pull_request.title }}

  build:
    name: Build
    if: ${{ github.actor != 'coderabbitai[bot]' && github.triggering_actor != 'coderabbitai[bot]' && !github.event.pull_request.draft }}
    needs: [branch-validation, pull-request-title-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build
        uses: ./.github/actions/build

  lint:
    name: Lint
    if: ${{ github.actor != 'coderabbitai[bot]' && github.triggering_actor != 'coderabbitai[bot]' && !github.event.pull_request.draft }}
    needs: [branch-validation, pull-request-title-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Android Lint
        uses: ./.github/actions/android-lint

  unit-tests:
    name: Unit tests
    if: ${{ github.actor != 'coderabbitai[bot]' && github.triggering_actor != 'coderabbitai[bot]' && !github.event.pull_request.draft }}
    needs: [branch-validation, pull-request-title-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run app unit tests
        uses: ./.github/actions/unit-tests

  architecture-validation:
    name: Architecture validation
    if: ${{ !github.event.pull_request.draft }}
    needs: [branch-validation, pull-request-title-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run architecture checks
        uses: ./.github/actions/architecture-validation

  quality-report:
    name: Quality gate report
    needs:
      - branch-validation
      - pull-request-title-validation
      - release-version
      - build
      - lint
      - unit-tests
      - architecture-validation
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.actor != 'coderabbitai[bot]' && github.triggering_actor != 'coderabbitai[bot]' &&
          (github.event.action != 'edited' || github.event.changes.title || github.event.changes.base) &&
          !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Generate quality gate report
        uses: ./.github/actions/quality-report
        with:
          results-json: ${{ toJSON(needs) }}
