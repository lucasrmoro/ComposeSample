name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Full SHA of an approved commit on main to retry
        required: true
        type: string

permissions: {}

concurrency:
  group: android-release-main
  queue: max

jobs:
  version:
    name: Resolve approved release revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      parent: ${{ steps.version.outputs.parent }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      previous-tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate first-parent history and version
        id: version
        shell: bash
        env:
          REVISION: ${{ inputs.revision || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          git rev-list --first-parent HEAD > "$RUNNER_TEMP/main-revisions"
          grep -Fxq "$REVISION" "$RUNNER_TEMP/main-revisions"
          gh api "repos/$GITHUB_REPOSITORY/commits/$REVISION/pulls" |
            jq -e --arg revision "$REVISION" 'any(.[]; .base.ref == "main" and .merged_at != null and .merge_commit_sha == $revision)' > /dev/null
          script="$RUNNER_TEMP/validate-release.py"
          git show "$REVISION:.github/actions/release-version/validate.py" > "$script"
          python3 "$script" "$REVISION" --release --output "$GITHUB_OUTPUT"

  build:
    name: Build and validate ${{ matrix.flavor }} release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [prd, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/release-package
        with:
          flavor: ${{ matrix.flavor }}
          version: ${{ needs.version.outputs.version }}
          code: ${{ needs.version.outputs.code }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.flavor }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error

  sign:
    name: Sign ${{ matrix.flavor }} release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-signing-${{ matrix.flavor }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [prd, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: .github/actions/release-package
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.flavor }}
          path: candidate
      - name: Sign and verify APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: bash .github/actions/release-package/sign.sh
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: signed/ComposeSample.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.flavor }}
          path: signed/
          retention-days: 14
          if-no-files-found: error

  smoke:
    name: Install and launch ${{ matrix.flavor }} APK
    needs: [version, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [prd, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: .github/actions/release-package
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-${{ matrix.flavor }}
          path: signed
      - name: Download previous production APK for upgrade check
        if: matrix.flavor == 'prd' && needs.version.outputs.previous-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous-tag }}
        run: gh release download "$PREVIOUS_TAG" --pattern ComposeSample.apk --dir previous
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FLAVOR: ${{ matrix.flavor }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: bash .github/actions/release-package/smoke.sh

  publish:
    name: Publish production APK
    needs: [version, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-publication
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: .github/actions/release-package
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-prd
          path: signed
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
          TAG: ${{ needs.version.outputs.tag }}
          REVISION: ${{ needs.version.outputs.commit }}
          PARENT: ${{ needs.version.outputs.parent }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous-tag }}
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: python3 .github/actions/release-package/publish.py
