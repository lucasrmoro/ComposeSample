name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Full SHA of an approved commit on main to retry
        required: true
        type: string

permissions: {}

concurrency:
  group: android-release-main
  queue: max

jobs:
  version:
    name: Resolve approved release revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      parent: ${{ steps.version.outputs.parent }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      previous-tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version
        id: version
        uses: ./.github/actions/release-version
        with:
          revision: ${{ inputs.revision || github.sha }}

  build:
    name: Build and validate ${{ matrix.flavor }} release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [prd, dev]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/release-package
        with:
          flavor: ${{ matrix.flavor }}
          version: ${{ needs.version.outputs.version }}
          code: ${{ needs.version.outputs.code }}
          revision: ${{ needs.version.outputs.commit }}
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.flavor }}
          path: candidate/
          retention-days: 7
          if-no-files-found: error

  sign:
    name: Sign ${{ matrix.flavor }} release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-signing-${{ matrix.flavor }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [prd, dev]
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.flavor }}
          path: candidate
      - name: Sign and verify APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          : "${RELEASE_KEYSTORE_BASE64:?Configure the production keystore in the signing environment}"
          : "${RELEASE_KEY_ALIAS:?Configure the signing alias}"
          : "${RELEASE_STORE_PASSWORD:?Configure the keystore password}"
          : "${RELEASE_KEY_PASSWORD:?Configure the key password}"
          : "${RELEASE_CERT_SHA256:?Configure the expected SHA-256 signing certificate fingerprint}"

          temporary="$(mktemp -d)"
          trap 'rm -rf -- "$temporary"' EXIT
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$temporary/release.keystore"
          unset RELEASE_KEYSTORE_BASE64
          mkdir -p signed
          "$sdk_tools/zipalign" -P 16 -f 4 candidate/unsigned.apk "$temporary/aligned.apk"
          "$sdk_tools/apksigner" sign --ks "$temporary/release.keystore" --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
              --out signed/ComposeSample.apk "$temporary/aligned.apk"
          unset RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD
          rm -f signed/ComposeSample.apk.idsig
          "$sdk_tools/zipalign" -c -P 16 4 signed/ComposeSample.apk
          "$sdk_tools/apksigner" verify --verbose --print-certs signed/ComposeSample.apk > "$temporary/certificate"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$temporary/certificate")"
          expected="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]]
          [[ "$(grep -c '^Signer #[0-9]* certificate SHA-256 digest:' "$temporary/certificate")" == 1 ]]
          printf '%s\n' "$actual" > signed/signing-certificate-sha256.txt
          cp candidate/release.json candidate/RELEASE_NOTES.md candidate/sbom.cdx.json signed/
          (cd signed && sha256sum ComposeSample.apk release.json RELEASE_NOTES.md sbom.cdx.json signing-certificate-sha256.txt > SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: signed/ComposeSample.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.flavor }}
          path: signed/
          retention-days: 14
          if-no-files-found: error

  smoke:
    name: Install and launch ${{ matrix.flavor }} APK
    needs: [version, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [prd, dev]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-${{ matrix.flavor }}
          path: signed
      - name: Download previous production APK for upgrade check
        if: matrix.flavor == 'prd' && needs.version.outputs.previous-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous-tag }}
        run: gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern ComposeSample.apk --dir previous
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          APK_PACKAGE: ${{ matrix.flavor == 'dev' && 'br.com.composesample.dev' || 'br.com.composesample' }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: |
            if [[ -f previous/ComposeSample.apk ]]; then adb install previous/ComposeSample.apk; fi
            adb install -r signed/ComposeSample.apk
            set -o pipefail; adb shell am start -W -n "$APK_PACKAGE/br.com.composesample.activity.LauncherActivity" | grep 'Status: ok'
            sleep 5
            adb shell pidof "$APK_PACKAGE"
            crash_log="$(adb logcat -b crash -d)" && ! grep -F "Process: $APK_PACKAGE," <<< "$crash_log"

  publish:
    name: Publish production APK
    needs: [version, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-publication
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-prd
          path: signed
      - name: Verify signed artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd signed && sha256sum --check SHA256SUMS)
          gh attestation verify signed/ComposeSample.apk --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/android-release.yml"
      - name: Publish immutable release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
          TAG: ${{ needs.version.outputs.tag }}
          REVISION: ${{ needs.version.outputs.commit }}
          PARENT: ${{ needs.version.outputs.parent }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous-tag }}
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        with:
          script: |
            const fs = require('node:fs');
            const { createHash } = require('node:crypto');
            const { TAG: tag, REVISION: revision, PREVIOUS_TAG: previousTag, PARENT: parent,
              VERSION: version, VERSION_CODE: versionCode } = process.env;
            if (process.env.RELEASE_PUBLICATION_ENABLED !== 'true') {
              throw new Error('Enable immutable releases and configure the publication environment.');
            }
            const repo = github.rest.repos;
            const releases = async () => github.paginate(repo.listReleases, context.repo);
            const lookup = async name => (await releases()).find(item => item.tag_name === name);
            const tagCommit = async name => {
              try {
                let { data: { object } } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${name}` });
                while (object.type === 'tag') {
                  ({ data: { object } } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha }));
                }
                return object.type === 'commit' ? object.sha : undefined;
              } catch (error) {
                if (error.status !== 404) throw error;
                return undefined;
              }
            };
            if (previousTag) {
              const previous = await lookup(previousTag);
              if (!previous?.immutable || previous.draft || (await tagCommit(previousTag)) !== parent) {
                throw new Error(`Publish ${previousTag} before retrying ${tag}.`);
              }
            }
            const names = ['ComposeSample.apk', 'RELEASE_NOTES.md', 'release.json', 'sbom.cdx.json',
              'signing-certificate-sha256.txt', 'SHA256SUMS'];
            if (fs.readdirSync('signed').sort().join('\n') !== names.slice().sort().join('\n')) {
              throw new Error('Signed release asset inventory differs from policy.');
            }
            const metadata = JSON.parse(fs.readFileSync('signed/release.json', 'utf8'));
            if (metadata.sourceCommit !== revision || metadata.versionName !== version ||
                metadata.versionCode !== Number(versionCode) || metadata.flavor !== 'prd') {
              throw new Error('Signed APK metadata differs from the approved revision.');
            }
            const existingTag = await tagCommit(tag);
            if (existingTag && existingTag !== revision) throw new Error(`${tag} points to another revision.`);
            let release = await lookup(tag);
            if (!release) {
              ({ data: release } = await repo.createRelease({
                ...context.repo, tag_name: tag, target_commitish: revision, name: tag,
                body: fs.readFileSync('signed/RELEASE_NOTES.md', 'utf8'), draft: true
              }));
            }
            if (release.name !== tag || release.target_commitish !== revision) {
              throw new Error('Release name or target differs from the approved revision.');
            }
            const verifyAssets = assets => {
              const existing = new Set();
              for (const asset of assets) {
                if (!names.includes(asset.name)) throw new Error(`Unexpected release asset ${asset.name}.`);
                const data = fs.readFileSync(`signed/${asset.name}`);
                const digest = `sha256:${createHash('sha256').update(data).digest('hex')}`;
                if (asset.digest !== digest) {
                  throw new Error(`${asset.name} differs from the original release asset. Retry with the original artifact.`);
                }
                existing.add(asset.name);
              }
              return existing;
            };
            const existing = verifyAssets(release.assets);
            if (release.draft) {
              for (const name of names.filter(name => !existing.has(name))) {
                const data = fs.readFileSync(`signed/${name}`);
                await repo.uploadReleaseAsset({
                  ...context.repo, release_id: release.id, name, data,
                  headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
                });
              }
              const assets = await github.paginate(repo.listReleaseAssets, {
                ...context.repo, release_id: release.id
              });
              if (verifyAssets(assets).size !== names.length) throw new Error('Incomplete draft release.');
              await repo.updateRelease({ ...context.repo, release_id: release.id, draft: false });
            } else if (existing.size !== names.length) {
              throw new Error('Published release has missing assets.');
            }
            const final = await lookup(tag);
            if (!final?.immutable || final.draft || (await tagCommit(tag)) !== revision) {
              throw new Error('The release must be immutable and its tag must identify the approved revision.');
            }
