reviews:
  review_progress: true
  commit_status: true
  fail_commit_status: true
  auto_review:
    enabled: true
    auto_pause_after_reviewed_commits: 0
    drafts: true
    base_branches:
      - ".*"
  auto_approvals:
    enabled: true
    allow_author_approval: false
    max_merge_risk: critical
